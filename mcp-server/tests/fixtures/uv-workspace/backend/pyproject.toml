[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi[standard]<1.0.0,>=0.114.2",
  "pydantic>2.0",
  "sqlmodel<1.0.0,>=0.0.21",
  "alembic<2.0.0,>=1.12.1",
  "psycopg[binary]<4.0.0,>=3.1.13",
  "httpx<1.0.0,>=0.25.1",
]

[dependency-groups]
dev = [
  "pytest<8.0.0,>=7.4.3",
  "mypy<2.0.0,>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
