name: CI

# Runs on every PR + every push to main.
#
# Jobs:
#   - check    Lint + typecheck + production build (~1 min)
#   - vitest   Unit/integration tests for mcp-server analyzers
#   - e2e      Playwright against the PR's Vercel preview URL
#              (skipped automatically if VERCEL_PREVIEW_URL isn't provided
#               or if the preview hasn't deployed yet — non-blocking until
#               we wire up the Vercel deployment status check)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Lint is currently non-blocking: the codebase has ~120 pre-existing
      # eslint errors. Surface them as a soft signal until they're paid down
      # (then flip continue-on-error to false).
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      # The production build IS blocking. If tsc or vite fails, the PR can't
      # merge.
      - run: npm run build

  vitest:
    name: Analyzer tests (mcp-server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      - working-directory: mcp-server
        run: npm ci
      - working-directory: mcp-server
        run: npm test

  e2e:
    name: Playwright (preview URL)
    runs-on: ubuntu-latest
    # Vercel deploys per-PR previews; we Playwright against them.
    #
    # Vercel Deployment Protection (SSO) blocks anonymous requests to preview
    # URLs by default, so every Playwright assertion fails on the SSO redirect
    # page. To make this job pass:
    #
    #   1. In Vercel → Project Settings → Deployment Protection → "Protection
    #      Bypass for Automation", click "Add Secret". Copy the value.
    #   2. In GitHub → Repo Settings → Secrets → Actions, add a secret named
    #      VERCEL_AUTOMATION_BYPASS_SECRET with that value.
    #
    # Once the secret is set, this job sends it as both the
    # x-vercel-protection-bypass header AND ?x-vercel-set-bypass-cookie query
    # param so the preview bypasses SSO for all Playwright traffic. Until then,
    # the job runs advisory (continue-on-error) so CI doesn't red-mark PRs.
    if: github.event_name == 'pull_request'
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Pull the Vercel preview URL from the Deployment API.
      # Requires the Vercel GitHub integration to be installed (which posts
      # the deployment); no extra secrets needed.
      - name: Resolve Vercel preview URL
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            // Wait up to 3 min for Vercel's deployment to land.
            for (let i = 0; i < 18; i++) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha, per_page: 10,
              });
              const vercel = deployments.find((d) => d.environment?.toLowerCase().includes('preview'));
              if (vercel) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: vercel.id,
                });
                const success = statuses.find((s) => s.state === 'success');
                if (success?.environment_url) {
                  core.setOutput('url', success.environment_url);
                  console.log(`Preview URL: ${success.environment_url}`);
                  return;
                }
              }
              await new Promise((r) => setTimeout(r, 10_000));
            }
            console.log('No Vercel preview deployment found within 3 minutes; skipping E2E.');
            core.setOutput('url', '');

      - name: Skip if no preview available
        if: steps.preview.outputs.url == ''
        run: echo "::notice::Vercel preview URL not available; E2E skipped this run."

      - name: Warn if bypass secret missing
        if: steps.preview.outputs.url != '' && env.HAS_BYPASS != 'true'
        env:
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' && 'true' || 'false' }}
        run: |
          echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set. Playwright will hit Vercel's SSO page on every request and most tests will fail. See .github/workflows/ci.yml header for setup steps."

      - name: Install deps
        if: steps.preview.outputs.url != ''
        run: npm ci

      - name: Install Playwright browsers
        if: steps.preview.outputs.url != ''
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against preview
        if: steps.preview.outputs.url != ''
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          # Forwarded to playwright.config.ts (read in extraHTTPHeaders). When
          # the secret is empty, the header is empty and Vercel still gates.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always() && steps.preview.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
