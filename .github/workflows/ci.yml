name: CI

# Runs on every PR + every push to main.
#
# Jobs:
#   - check    Lint + typecheck + production build (~1 min)
#   - vitest   Unit/integration tests for mcp-server analyzers
#   - e2e      Playwright against the PR's Vercel preview URL
#              (skipped automatically if VERCEL_PREVIEW_URL isn't provided
#               or if the preview hasn't deployed yet — non-blocking until
#               we wire up the Vercel deployment status check)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Lint is now a blocking check. Backlog cleared 2026-05-26; warnings
      # are allowed (see eslint.config.js) but errors fail the build.
      - name: Lint
        run: npm run lint

      # The production build IS blocking. If tsc or vite fails, the PR can't
      # merge.
      - run: npm run build

  vitest:
    name: Analyzer tests (mcp-server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      - working-directory: mcp-server
        run: npm ci
      - working-directory: mcp-server
        run: npm test

  e2e:
    name: Playwright (preview URL)
    runs-on: ubuntu-latest
    # Vercel deploys per-PR previews; we Playwright against them.
    #
    # Vercel Deployment Protection (SSO) gates the previews — the
    # VERCEL_AUTOMATION_BYPASS_SECRET GitHub Actions secret (set up via
    # the Vercel project's "Protection Bypass for Automation" setting) is
    # forwarded to Playwright via playwright.config.ts, which sends it as
    # the x-vercel-protection-bypass header and as a cookie so the Vercel
    # edge routes traffic past SSO. If the secret is removed, Playwright
    # will see SSO pages and most tests will fail — that's the signal.
    if: github.event_name == 'pull_request'
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Pull the Vercel preview URL from the Deployment API using the
      # preinstalled `gh` CLI. We avoid actions/github-script because its
      # @v7 SHA has been flaky on codeload.github.com (intermittent 404s)
      # and the GitHub CLI is already on every runner with the workflow's
      # GITHUB_TOKEN auto-applied.
      - name: Resolve Vercel preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          URL=""
          # Up to ~3 min: 18 polls × 10s
          for i in $(seq 1 18); do
            # listDeployments returns newest-first; we filter to Preview envs.
            URL=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=20" --jq '
              map(select(.environment | ascii_downcase | contains("preview")))
              | .[0]?.id // empty
            ' 2>/dev/null | xargs -I{} gh api "repos/$REPO/deployments/{}/statuses" --jq '
              map(select(.state == "success" and (.environment_url // "") != ""))
              | .[0]?.environment_url // empty
            ' 2>/dev/null || true)
            if [ -n "$URL" ]; then
              echo "Preview URL: $URL"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "No Vercel preview deployment found within 3 minutes; skipping E2E."
          echo "url=" >> "$GITHUB_OUTPUT"

      - name: Skip if no preview available
        if: steps.preview.outputs.url == ''
        run: echo "::notice::Vercel preview URL not available; E2E skipped this run."

      - name: Warn if bypass secret missing
        if: steps.preview.outputs.url != '' && env.HAS_BYPASS != 'true'
        env:
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' && 'true' || 'false' }}
        run: |
          echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set. Playwright will hit Vercel's SSO page on every request and most tests will fail. See .github/workflows/ci.yml header for setup steps."

      - name: Install deps
        if: steps.preview.outputs.url != ''
        run: npm ci

      - name: Install Playwright browsers
        if: steps.preview.outputs.url != ''
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against preview
        if: steps.preview.outputs.url != ''
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          # Forwarded to playwright.config.ts (read in extraHTTPHeaders). When
          # the secret is empty, the header is empty and Vercel still gates.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always() && steps.preview.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
